plugins {
	id 'fabric-loom' version '1.13-SNAPSHOT'
}

base.archivesName = project.archives_base_name
version = project.mod_version
group = project.maven_group

repositories {
	maven { url "https://maven.shedaniel.me/" }
	maven { url "https://maven.terraformersmc.com/" }
	exclusiveContent {
		forRepository { maven { url "https://api.modrinth.com/maven" } }
		filter { includeGroup "maven.modrinth" }
	}
}

// Client gametest: boots a real client, opens the inventory and screenshots the bar.
//   gradlew runClientGameTest   ->  build/run/clientGameTest/screenshots
fabricApi {
	configureTests {
		createSourceSet = true
		modId = "wynnkeybindhelper-test"
		enableGameTests = false
		enableClientGameTests = true
		eula = true
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	// Official Mojang names on purpose: 26.x ships unobfuscated with these same names,
	// so the port is a dependency bump rather than a remap.
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	// Optional integrations: compiled against, never bundled or required at runtime.
	modCompileOnly "maven.modrinth:wynntils:${project.wynntils_version}"

	// Cloth Config + Mod Menu together provide the settings screen. Present in the dev client.
	modCompileOnly modLocalRuntime("me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}") {
		exclude(group: "net.fabricmc.fabric-api")
	}
	modCompileOnly modLocalRuntime("com.terraformersmc:modmenu:${project.mod_menu_version}") {
		exclude(group: "net.fabricmc.fabric-api")
	}
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": project.version, "fabric_version": project.fabric_version, "loader_version": project.loader_version, "minecraft_version": project.minecraft_version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
	it.options.encoding = "UTF-8"
}

java {
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}
