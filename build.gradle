plugins {
	id 'fabric-loom' version '1.13-SNAPSHOT'
}

base.archivesName = project.archives_base_name
version = project.mod_version
group = project.maven_group

repositories {
	maven { url "https://maven.shedaniel.me/" }
	maven { url "https://maven.terraformersmc.com/" }
	exclusiveContent {
		forRepository { maven { url "https://api.modrinth.com/maven" } }
		filter { includeGroup "maven.modrinth" }
	}
}

// Client gametest: boots a real client, opens the inventory and screenshots the bar.
//   gradlew runClientGameTest   ->  build/run/clientGameTest/screenshots
fabricApi {
	configureTests {
		createSourceSet = true
		modId = "wynnkeybindwizard-test"
		enableGameTests = false
		enableClientGameTests = true
		eula = true
	}
}

// gradlew checkModKeys [-PmodsDir=<pack mods folder>] [-Pconfig=<wynnkeybindwizard.json>]
// Run by hand when the supported mods update. Checks every keybind id in the layout against the
// newest release of each mod on Modrinth (see src/modcheck), then compiles the Wynntils
// integration against the newest Wynntils. Only then does the build reach out to Modrinth.
def checkingMods = gradle.startParameter.taskNames.any { it == 'checkModKeys' || it.endsWith(':checkModKeys') }

def newestModrinthVersion(String slug) {
	def query = URLEncoder.encode("[\"${project.minecraft_version}\"]", 'UTF-8')
	def connection = new URL("https://api.modrinth.com/v2/project/${slug}/version?game_versions=${query}&loaders=%5B%22fabric%22%5D").openConnection()
	connection.setRequestProperty('User-Agent', 'wynnkeybindwizard-modcheck')
	def versions = new groovy.json.JsonSlurper().parse(connection.inputStream)
	if (versions.isEmpty()) throw new GradleException("No ${slug} release for Minecraft ${project.minecraft_version} on Modrinth")
	return versions.max { it.date_published }
}

sourceSets {
	modcheck {
		compileClasspath += main.output + main.compileClasspath
		runtimeClasspath += main.output + main.compileClasspath
	}
	// The Wynntils integration again, compiled against the newest Wynntils instead of the pinned one.
	wynntilsLatest {
		java {
			srcDirs = ['src/main/java']
			include 'me/jamino/wynnkeybindwizard/compat/**'
		}
		compileClasspath += main.output + main.compileClasspath.filter { !it.path.contains('wynntils') }
	}
}
loom.createRemapConfigurations(sourceSets.wynntilsLatest)

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	// Official Mojang names on purpose: 26.x ships unobfuscated with these same names,
	// so the port is a dependency bump rather than a remap.
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	// Optional integrations: compiled against, never bundled or required at runtime.
	modCompileOnly "maven.modrinth:wynntils:${project.wynntils_version}"
	if (checkingMods) {
		def newest = newestModrinthVersion('wynntils')
		logger.lifecycle("checkModKeys: compiling the Wynntils integration against Wynntils ${newest.version_number}")
		modWynntilsLatestCompileOnly "maven.modrinth:wynntils:${newest.id}"
	}

	// Cloth Config + Mod Menu together provide the settings screen. Present in the dev client.
	modCompileOnly modLocalRuntime("me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}") {
		exclude(group: "net.fabricmc.fabric-api")
	}
	modCompileOnly modLocalRuntime("com.terraformersmc:modmenu:${project.mod_menu_version}") {
		exclude(group: "net.fabricmc.fabric-api")
	}
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": project.version, "fabric_version": project.fabric_version, "loader_version": project.loader_version, "minecraft_version": project.minecraft_version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
	it.options.encoding = "UTF-8"
}

java {
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.archives_base_name}" }
	}
}

tasks.register('checkModKeys', JavaExec) {
	group = 'verification'
	description = 'Checks the layout keybind ids against the newest release of each supported mod.'
	classpath = sourceSets.modcheck.runtimeClasspath
	mainClass = 'me.jamino.wynnkeybindwizard.modcheck.ModKeyCheck'
	args project.minecraft_version, layout.buildDirectory.dir('modcheck').get().asFile.path
	if (project.hasProperty('modsDir')) args '--mods', project.property('modsDir')
	if (project.hasProperty('config')) args '--config', project.property('config')
	// Runs even when ids are missing, so one run reports both.
	finalizedBy 'compileWynntilsLatestJava'
}
